# This is the main configuration file for Bukkit.
# As you can see, there's actually not that much to configure without any plugins.
# For a reference for any variable inside this file, check out the bukkit wiki at
# http://wiki.bukkit.org/Bukkit.yml
settings:
  allow-end: false
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  ping-packet-limit: 100
  use-exact-login-location: false
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server fechado volte mais tarde!
  whitelist-message: '&cServidor em manutencao. Volte mais tarde!'
  log-commands: true
  command-complete: true
  spam-exclusions:
  - /skill
  filter-unsafe-ips: false
  tab-ping: false
  timeout-time: 60
  restart-on-crash: false
  restart-script-location: /path/to/server/start.sh
  bungee-proxies:
  - 127.0.0.1
  texture-resolution: 16
world-settings:
  default:
    growth-chunks-per-tick: 0
    mob-spawn-range: 2
    random-light-updates: false
    aggregate-chunkticks: 1
    item-merge-radius: 4.0
    exp-merge-radius: 4.0
    wheat-growth-modifier: 0
    cactus-growth-modifier: 0
    melon-growth-modifier: 0
    pumpkin-growth-modifier: 0
    sugar-growth-modifier: 0
    tree-growth-modifier: 0
    mushroom-growth-modifier: 0
    entity-activation-range-animals: 8
    entity-activation-range-monsters: 16
    entity-activation-range-misc: 4
    entity-tracking-range-players: 40
    entity-tracking-range-animals: 16
    entity-tracking-range-monsters: 32
    entity-tracking-range-misc: 16
    entity-tracking-range-max: 40
    info: true
  world:
    growth-chunks-per-tick: 1000
  world_nether:
    view-distance: 5
    growth-chunks-per-tick: 0
    random-light-updates: true
spawn-limits:
  monsters: 70
  animals: 15
  water-animals: 5
  ambient: 15
chunk-gc:
  period-in-ticks: 300
  load-threshold: 0
ticks-per:
  animal-spawns: 400
  monster-spawns: 10
  autosave: 6000
  hopper-transfer: 8
  hopper-check: 8
auto-updater:
  enabled: false
  on-broken:
  - warn-console
  on-update:
  - warn-console
  preferred-channel: rb
  host: dl.bukkit.org
  suggest-channels: false
database:
  username: bukkit
  isolation: SERIALIZABLE
  driver: org.sqlite.JDBC
  password: walrus
  url: jdbc:sqlite:{DIR}{NAME}.db
orebfuscator:
  enable: false
  engine-mode: 1
  disabled-worlds:
  - world_the_end
  blocks:
  - 1
  - 5
  - 14
  - 15
  - 16
  - 21
  - 48
  - 49
  - 54
  - 56
  - 73
  - 74
  - 82
  - 129
  - 130
config-version: 2
