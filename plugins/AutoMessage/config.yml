    - '&fCompre &2VIP&f e tenha vantagens! Acesse &2magicpvp.com.br'
    - '&fQuer a tag &2Youtuber&f? Poste um video e mande no Discord!'
    - '&fCrie seu cla com &2/clan create <tag> <nome> &f- custa apenas &2500 Reais&f!'
    - '&fCompre seu terreno com &2/terreno &f- construa sem medo!'
