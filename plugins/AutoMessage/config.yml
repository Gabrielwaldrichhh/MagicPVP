  x1:
    enabled: true
    random: false
    interval: 3600
    expiry: -1
    prefix: ''
    suffix: ''
    messages:
    - '&8&m==============================='
    - '&8[&c&lX1&8] &fEvento X1 disponivel! Desafie alguem!'
    - '&8[&c&lX1&8] &fUse &c/x1 desafiar <jogador> &fpara iniciar uma luta!'
    - '&8[&c&lX1&8] &fPremio: &a$30.000 Reais &fpara o vencedor!'
    - '&8&m==============================='
  vip:
    enabled: true
    random: false
    interval: 240
    expiry: -1
    prefix: '&8[&a!&8] '
    suffix: ''
    messages:
    - '&8[&6VIP&8] &fUse &2/fly &fpara voar!'
    - '&8[&6VIP&8] &fUse &2/repair &fpara reparar seus itens!'
