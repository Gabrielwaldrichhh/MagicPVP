settings:
  enabled: true
  min-players: 0
  log-to-console: false
message-lists:
  default:
    enabled: true
    random: false
    interval: 120
    expiry: -1
    prefix: '&8[&2MagicPVP&8] '
    suffix: ''
    messages:
    - '&fNao use a senha do &2MagicPVP &fem outros servidores! &8| &aplay.magicpvp.com.br'
