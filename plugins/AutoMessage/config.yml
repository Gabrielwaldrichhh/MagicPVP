#  ----------------------------------------------------
#  AutoMessage Configuration File
#  ----------------------------------------------------
#  Message Configuration:
#     Messages are handled in lists to allow for advanced customization!
#     Feel free to add color codes by using & in your messages!
#     To split a message onto multiple lines use the \n delimiter!
#     Lines starting with / will be run as a command!
#     To add single apostrophes into a message use ''.
#     For a complete tutorial go to http://dev.bukkit.org/server-mods/automessage.
#     If you are unfamiliar with YAML use the in-game commands: /am help

settings:
  enabled: true
  min-players: 0
  log-to-console: false
message-lists:
  default:
    enabled: true
    random: false
    interval: 120
    expiry: -1
    prefix: '&8&l[&c&l!&8&l] -> '
    suffix: ''
    messages:
    - '&6Nao use a senha do MagicPVP em nenhum outro servidor'
    - '&6O Servidor esta em fase de teste, se achar um BUG Reporte!'
    - '&6Todos os domingo &219:00 &6Evento Gladiador'
    - '&6Quer Comprar Vip? Acesse '
    - '&6Quer tag &4You&fTuber? Poste um video e mande no Discord do Servidor!'
    - '&6Vips Tem muitas vantagens verifique no site!'
    - '&6Para comprar um terreno, digite /terrenos!'
  vip:
    enabled: true
    random: false
    interval: 120
    expiry: -1
    prefix: '&8&l[&c&l!&8&l] -> '
    suffix: '&8&l[&d&lVIP&8&l]'
    messages:
    - '&6Nao use a senha do MagicPVP nenhum outro servidor'
    - '&6Todos os domingo &219:00 &6Evento Gladiador'
    - '&6Use o comando /fly para voar'