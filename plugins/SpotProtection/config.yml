################Economia##################

# Preco por bloco ao comprar terreno
# Ex: /spot comprar 20 casa = 20 * PrecoBlocoCompra = R$200
PrecoBlocoCompra: 100

# Preco por bloco ao expandir
PrecoBlocoExpansao: 50

# Preco para ativar/desativar PvP no terreno
PrecoDoPVP: 500

# Abreviacao da moeda
NomeDaMoeda: R$

# Nome do servidor nas placas
NomeDoServer: MagicPVP

##############Protection####################

# false = altura livre | true = alinhado ao chao
Alinhar: true

# ID do bloco de contorno do terreno (85 = fence de madeira)
BlockId: 85

# Maximo de areas por player
MaxDeAreas: 1

# Tamanho minimo: 10 | Tamanho maximo por compra
TamanhoMax: 100

# Bloquear /sethome em areas de outros players
AntHome: true

# Altura de protecao (0-256 = bedrock ao topo)
AlturaMaxEMin: 0-256

# Remover arvores ao comprar area
RemoverArvores: false

# Linguagem
Linguagem: pt_BR
