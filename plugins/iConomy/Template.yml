    purge: "<rose>Todas as contas inativas foram purgados."
    create: "<red>Conta criada com o nome <white>+name<red>."
    remove: "<red>Conta deletada: <white>+name<red>."
    status: "<red>Status da conta e agora <white>+status<red>."

top:
    opening: "<red>-----[ <white>Magnatas <red>]-----"
