    exists: "<rose>Conta ja existe."
    create: "<rose>Nao foi possivel criar uma conta com o nome <white>+name<rose>."
    remove: "<rose>Não foi possivel remover a conta com o nome <white>+name<rose>."
    account: "<rose>Conta <white>+name<rose> nao existe."
    funds: "<rose>Desculpe, voce nao tem fundos suficientes para fazer isso."
